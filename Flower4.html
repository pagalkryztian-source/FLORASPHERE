<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Bioluminescent Blue Spider Lily</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #0a1930 0%, #040917 58%, #010308 100%);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Minimalist Left / Right File Switchers */
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 38px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      color: rgba(224, 242, 254, 0.82);
      font-size: 20px;
      font-weight: 300;
      text-decoration: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .nav-arrow:hover {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(125, 211, 252, 0.45);
      color: #ffffff;
    }

    .nav-arrow.prev:active,
    .nav-arrow.next:active {
      transform: translateY(-50%) scale(0.94);
    }

    .nav-arrow.prev {
      left: 12px;
    }

    .nav-arrow.next {
      right: 12px;
    }

    /* Minimalist Bottom-Right "Send to someone" Button */
    .send-btn {
      position: fixed;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: rgba(224, 242, 254, 0.88);
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .send-btn:hover {
      background: rgba(56, 189, 248, 0.18);
      color: #ffffff;
    }

    .send-btn:active {
      transform: scale(0.96);
    }

    .send-btn.copied {
      color: #7dd3fc;
      border-color: rgba(125, 211, 252, 0.55);
      background: rgba(14, 165, 233, 0.18);
    }

    @media (max-width: 600px) {
      .nav-arrow {
        width: 32px;
        height: 46px;
        font-size: 18px;
        border-radius: 10px;
      }

      .nav-arrow.prev {
        left: 8px;
      }

      .nav-arrow.next {
        right: 8px;
      }

      .send-btn {
        right: 10px;
        bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        padding: 6px 11px;
        font-size: 11.5px;
      }
    }
  </style>
</head>
<body>
  <a href="Flower3.html" class="nav-arrow prev" aria-label="Previous flower file">&lt;</a>
  <a href="Flower5.html" class="nav-arrow next" aria-label="Next flower file">&gt;</a>
  <button type="button" class="send-btn" id="sendToSomeoneBtn" data-target-file="Flower4.html">
    Send to someone
  </button>

  <script>
    (function setupLinkCopy() {
      const btn = document.getElementById('sendToSomeoneBtn');
      if (!btn) return;

      let resetTimer = null;

      function getFlowerFileUrl() {
        const targetFile = btn.getAttribute('data-target-file') || 'Flower4.html';
        try {
          const currentUrl = new URL(window.location.href);
          const pathParts = currentUrl.pathname.split('/');
          if (pathParts[pathParts.length - 1] && pathParts[pathParts.length - 1].includes('.')) {
            pathParts[pathParts.length - 1] = targetFile;
          } else {
            if (!currentUrl.pathname.endsWith('/')) {
              pathParts.push('');
            }
            pathParts.push(targetFile);
          }
          currentUrl.pathname = pathParts.join('/').replace(/\/{2,}/g, '/');
          return currentUrl.toString();
        } catch (e) {
          return targetFile;
        }
      }

      async function copyTextToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (err) {
            // Fall through to execCommand fallback
          }
        }

        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.setAttribute('readonly', '');
        textArea.style.position = 'fixed';
        textArea.style.top = '0';
        textArea.style.left = '-9999px';
        textArea.style.opacity = '0';
        document.body.appendChild(textArea);

        const selection = document.getSelection();
        const selectedRange = selection && selection.rangeCount > 0 ? selection.getRangeAt(0) : null;

        textArea.focus();
        textArea.select();
        textArea.setSelectionRange(0, textArea.value.length);

        let copied = false;
        try {
          copied = document.execCommand('copy');
        } catch (err) {
          copied = false;
        }

        document.body.removeChild(textArea);
        if (selectedRange && selection) {
          selection.removeAllRanges();
          if (selectedRange) selection.addRange(selectedRange);
        }
        return copied;
      }

      btn.addEventListener('click', async (event) => {
        event.stopPropagation();
        const urlToCopy = getFlowerFileUrl();
        const success = await copyTextToClipboard(urlToCopy);

        btn.textContent = success ? 'Link copied' : urlToCopy;
        btn.classList.add('copied');

        if (resetTimer) clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
          btn.textContent = 'Send to someone';
          btn.classList.remove('copied');
        }, 2000);
      });
    })();
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // --- 1. SCENE, CAMERA, RENDERER & BLOOM COMPOSER ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040917);
    scene.fog = new THREE.FogExp2(0x040917, 0.022);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.4;

    const renderTarget = new THREE.WebGLRenderTarget(
      window.innerWidth * Math.min(window.devicePixelRatio, 2),
      window.innerHeight * Math.min(window.devicePixelRatio, 2),
      {
        type: THREE.HalfFloatType,
        samples: 4
      }
    );

    const composer = new EffectComposer(renderer, renderTarget);
    const renderPass = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.65,
      0.52,
      0.58
    );
    const outputPass = new OutputPass();

    composer.addPass(renderPass);
    composer.addPass(bloomPass);
    composer.addPass(outputPass);

    function updateCameraFraming() {
      const aspect = window.innerWidth / window.innerHeight;
      camera.aspect = aspect;
      if (aspect < 0.75) {
        camera.position.set(0, 2.5, 11.8);
      } else if (aspect < 1.1) {
        camera.position.set(0, 2.2, 9.6);
      } else {
        camera.position.set(0, 2.0, 8.4);
      }
      camera.updateProjectionMatrix();
    }
    updateCameraFraming();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.75;
    controls.zoomSpeed = 0.85;
    controls.panSpeed = 0.75;
    controls.minDistance = 3.2;
    controls.maxDistance = 17;
    controls.maxPolarAngle = Math.PI * 0.88;
    controls.target.set(0, 0.85, 0);
    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN
    };

    // --- 2. NOCTURNAL MOONLIT & BIOLUMINESCENT LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0x1e3a8a, 0.75);
    scene.add(ambientLight);

    const moonKeyLight = new THREE.DirectionalLight(0xe0f2fe, 2.0);
    moonKeyLight.position.set(4.5, 9, 6);
    scene.add(moonKeyLight);

    const indigoRimLight = new THREE.DirectionalLight(0x6366f1, 1.6);
    indigoRimLight.position.set(-5, 6, -6);
    scene.add(indigoRimLight);

    const flowerCoreGlow = new THREE.PointLight(0x00d8ff, 3.8, 11);
    flowerCoreGlow.position.set(0, 1.55, 0);
    scene.add(flowerCoreGlow);

    const deepCobaltFill = new THREE.PointLight(0x2563eb, 2.2, 13);
    deepCobaltFill.position.set(3.2, 0.8, 3.2);
    scene.add(deepCobaltFill);

    // --- 3. PROCEDURAL LUMINOUS SPIDER LILY TEXTURES ---
    function createSpiderLilyPetalAlbedo() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 512, 0, 0);
      grad.addColorStop(0.00, '#e0f2fe');
      grad.addColorStop(0.22, '#38bdf8');
      grad.addColorStop(0.58, '#0284c7');
      grad.addColorStop(0.88, '#1d4ed8');
      grad.addColorStop(1.00, '#1e1b4b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 512);

      ctx.lineCap = 'round';
      for (let i = -12; i <= 12; i++) {
        ctx.strokeStyle = i === 0
          ? 'rgba(224, 242, 254, 0.88)'
          : 'rgba(125, 211, 252, 0.28)';
        ctx.lineWidth = i === 0 ? 3.2 : 1.1;
        ctx.beginPath();
        ctx.moveTo(128 + i * 2.5, 512);
        ctx.bezierCurveTo(
          128 + i * 7.5, 340,
          128 + i * 7.5, 170,
          128 + i * 1.8, 6
        );
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function createSpiderLilyEmissiveMap() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#041029';
      ctx.fillRect(0, 0, 256, 512);

      const throatGrad = ctx.createLinearGradient(0, 512, 0, 0);
      throatGrad.addColorStop(0.00, '#ffffff');
      throatGrad.addColorStop(0.25, '#38bdf8');
      throatGrad.addColorStop(0.65, '#0369a1');
      throatGrad.addColorStop(1.00, '#091534');
      ctx.fillStyle = throatGrad;
      ctx.fillRect(0, 0, 256, 512);

      const ribGrad = ctx.createLinearGradient(108, 0, 148, 0);
      ribGrad.addColorStop(0.0, 'rgba(0, 216, 255, 0)');
      ribGrad.addColorStop(0.5, 'rgba(224, 242, 254, 0.95)');
      ribGrad.addColorStop(1.0, 'rgba(0, 216, 255, 0)');
      ctx.fillStyle = ribGrad;
      ctx.fillRect(108, 12, 40, 500);

      for (let i = -8; i <= 8; i++) {
        ctx.strokeStyle = i === 0 ? 'rgba(255, 255, 255, 0.9)' : 'rgba(56, 189, 248, 0.45)';
        ctx.lineWidth = i === 0 ? 2.6 : 1.0;
        ctx.beginPath();
        ctx.moveTo(128 + i * 3, 512);
        ctx.quadraticCurveTo(128 + i * 8, 256, 128 + i * 2, 8);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function createSoftGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0.00, 'rgba(255, 255, 255, 1.0)');
      grad.addColorStop(0.25, 'rgba(125, 211, 252, 0.85)');
      grad.addColorStop(0.60, 'rgba(14, 165, 233, 0.25)');
      grad.addColorStop(1.00, 'rgba(2, 132, 199, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // --- 4. CUSTOM SCULPTED 3D SPIDER LILY GEOMETRIES ---
    function createSpiderLilyTepalGeometry(length, width, archBack, ruffleAmp, ruffleFreq) {
      const segU = 18;
      const segV = 44;
      const geometry = new THREE.PlaneGeometry(width, length, segU, segV);
      geometry.translate(0, length / 2, 0);

      const pos = geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);

        const v = y / length;
        const u = x / (width / 2);

        let widthProfile;
        if (v < 0.42) {
          widthProfile = 0.22 + 0.78 * Math.sin((v / 0.42) * Math.PI * 0.5);
        } else {
          const t = (v - 0.42) / 0.58;
          widthProfile = Math.pow(Math.max(0, Math.cos(t * Math.PI * 0.5)), 0.75);
        }
        const newX = x * widthProfile;

        const edgeWeight = Math.pow(Math.abs(u), 1.65) * Math.sin(Math.pow(v, 0.65) * Math.PI);
        const edgeRuffle = Math.sin(v * Math.PI * ruffleFreq) * ruffleAmp * edgeWeight;

        const midribFold = (1 - Math.abs(u)) * 0.045 * Math.sin(v * Math.PI);

        const recurveZ = -Math.pow(v, 1.75) * archBack + edgeRuffle + midribFold;
        const curledY = y - Math.pow(Math.max(0, (v - 0.45) / 0.55), 2.3) * (length * 0.24);

        pos.setXYZ(i, newX, curledY, recurveZ);
      }

      geometry.computeVertexNormals();
      return geometry;
    }

    function createAntherGeometry() {
      const geo = new THREE.SphereGeometry(0.022, 10, 10);
      geo.scale(0.85, 2.4, 0.85);
      return geo;
    }

    // --- 5. BUILD THE BIOLUMINESCENT BLUE SPIDER LILY ---
    const sceneRoot = new THREE.Group();
    scene.add(sceneRoot);

    const glowTex = createSoftGlowTexture();

    const groundGroup = new THREE.Group();
    groundGroup.position.y = -2.35;
    sceneRoot.add(groundGroup);

    const groundAuraMat = new THREE.MeshBasicMaterial({
      map: glowTex,
      color: 0x0284c7,
      transparent: true,
      opacity: 0.35,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const groundAura = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 5.5), groundAuraMat);
    groundAura.rotation.x = -Math.PI / 2;
    groundGroup.add(groundAura);

    const stemCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.04, -2.35, -0.04),
      new THREE.Vector3(-0.07, -0.95, 0.05),
      new THREE.Vector3(0.05, 0.35, -0.03),
      new THREE.Vector3(0.00, 1.38, 0.00)
    ]);

    const stemGeo = new THREE.TubeGeometry(stemCurve, 44, 0.054, 14, false);
    const stemMat = new THREE.MeshStandardMaterial({
      color: 0x0f2942,
      emissive: 0x0369a1,
      emissiveIntensity: 0.22,
      roughness: 0.42,
      metalness: 0.05
    });
    const stemMesh = new THREE.Mesh(stemGeo, stemMat);
    sceneRoot.add(stemMesh);

    const stemTip = stemCurve.getPoint(1);
    const umbelRoot = new THREE.Group();
    umbelRoot.position.copy(stemTip);
    sceneRoot.add(umbelRoot);

    const spatheMat = new THREE.MeshStandardMaterial({
      color: 0x1e3a8a,
      emissive: 0x0284c7,
      emissiveIntensity: 0.28,
      roughness: 0.55,
      side: THREE.DoubleSide
    });
    const spatheGeo = createSpiderLilyTepalGeometry(0.68, 0.22, 0.24, 0.01, 4);
    for (let s = 0; s < 2; s++) {
      const spathe = new THREE.Mesh(spatheGeo, spatheMat);
      spathe.rotation.y = s * Math.PI + 0.4;
      spathe.rotation.x = 2.15;
      umbelRoot.add(spathe);
    }

    const petalAlbedo = createSpiderLilyPetalAlbedo();
    const petalEmissive = createSpiderLilyEmissiveMap();

    // Note: transmission omitted so EffectComposer renders crisp, luminous petals without black artifacts
    const tepalMat = new THREE.MeshPhysicalMaterial({
      map: petalAlbedo,
      emissiveMap: petalEmissive,
      emissive: new THREE.Color(0x38bdf8),
      emissiveIntensity: 1.25,
      roughness: 0.28,
      metalness: 0.02,
      sheen: 1.0,
      sheenRoughness: 0.35,
      sheenColor: new THREE.Color(0xbae6fd),
      clearcoat: 0.25,
      clearcoatRoughness: 0.3,
      side: THREE.DoubleSide
    });

    const filamentMat = new THREE.MeshStandardMaterial({
      color: 0x7dd3fc,
      emissive: 0x00d8ff,
      emissiveIntensity: 1.55,
      roughness: 0.22
    });

    const antherMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x7dd3fc,
      emissiveIntensity: 2.3,
      roughness: 0.15
    });

    const pedicelMat = new THREE.MeshStandardMaterial({
      color: 0x1e40af,
      emissive: 0x0284c7,
      emissiveIntensity: 0.35,
      roughness: 0.4
    });

    const tepalGeo = createSpiderLilyTepalGeometry(1.48, 0.27, 0.56, 0.036, 9.0);
    const antherGeo = createAntherGeometry();

    function buildSpiderFloret(floretIndex) {
      const floretGroup = new THREE.Group();

      const pedicel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.018, 0.024, 0.36, 8),
        pedicelMat
      );
      pedicel.position.y = 0.18;
      floretGroup.add(pedicel);

      const ovary = new THREE.Mesh(
        new THREE.SphereGeometry(0.048, 12, 10),
        pedicelMat
      );
      ovary.scale.set(0.9, 1.35, 0.9);
      ovary.position.y = 0.38;
      floretGroup.add(ovary);

      const flowerHead = new THREE.Group();
      flowerHead.position.y = 0.42;
      floretGroup.add(flowerHead);

      const tepals = [];
      for (let t = 0; t < 6; t++) {
        const isInner = t % 2 === 1;
        const angle = (t / 6) * Math.PI * 2;
        const pivot = new THREE.Group();
        pivot.rotation.y = angle;
        pivot.position.y = isInner ? 0.018 : 0;

        const tepalMesh = new THREE.Mesh(tepalGeo, tepalMat);
        const targetOpen = isInner ? 0.96 : 1.08;
        tepalMesh.rotation.x = targetOpen;
        tepalMesh.scale.set(
          isInner ? 0.95 : 1.0,
          isInner ? 0.97 : 1.0,
          1.0
        );

        pivot.add(tepalMesh);
        flowerHead.add(pivot);
        tepals.push({
          mesh: tepalMesh,
          targetAngle: targetOpen,
          phase: floretIndex * 0.9 + t * 0.55
        });
      }

      const stamens = [];
      for (let s = 0; s < 6; s++) {
        const angle = (s / 6) * Math.PI * 2 + 0.26;
        const stamenPivot = new THREE.Group();
        stamenPivot.rotation.y = angle;

        const reach = 1.65 + (s % 2) * 0.16;
        const dip = -0.22 + (s % 3) * 0.06;
        const tipLift = 0.62 + (s % 2) * 0.14;

        const stCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0.02, 0.02, 0),
          new THREE.Vector3(reach * 0.35, dip, 0),
          new THREE.Vector3(reach * 0.76, tipLift * 0.42, 0),
          new THREE.Vector3(reach, tipLift, 0)
        ]);

        const filGeo = new THREE.TubeGeometry(stCurve, 24, 0.0085, 6, false);
        const filMesh = new THREE.Mesh(filGeo, filamentMat);

        const antherMesh = new THREE.Mesh(antherGeo, antherMat);
        const tipPt = stCurve.getPoint(1);
        antherMesh.position.copy(tipPt);
        antherMesh.rotation.z = Math.PI / 2 - 0.35;
        antherMesh.rotation.x = 0.3;

        const tipHalo = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: glowTex,
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.65,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          })
        );
        tipHalo.position.copy(tipPt);
        tipHalo.scale.set(0.26, 0.26, 1);

        stamenPivot.add(filMesh, antherMesh, tipHalo);
        flowerHead.add(stamenPivot);
        stamens.push({ group: stamenPivot, phase: floretIndex * 1.1 + s * 0.7 });
      }

      const pistilCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0.03, 0),
        new THREE.Vector3(0.55, -0.14, 0.08),
        new THREE.Vector3(1.38, 0.36, 0.12),
        new THREE.Vector3(1.96, 0.84, 0.06)
      ]);
      const pistilGeo = new THREE.TubeGeometry(pistilCurve, 26, 0.009, 6, false);
      const pistilMesh = new THREE.Mesh(pistilGeo, filamentMat);

      const stigmaMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.024, 10, 10),
        antherMat
      );
      stigmaMesh.position.copy(pistilCurve.getPoint(1));
      flowerHead.add(pistilMesh, stigmaMesh);

      return { root: floretGroup, tepals, stamens };
    }

    const allFlorets = [];
    const radialFloretCount = 5;
    for (let i = 0; i < radialFloretCount; i++) {
      const azimuth = (i / radialFloretCount) * Math.PI * 2;
      const floret = buildSpiderFloret(i);
      floret.root.rotation.order = 'YXZ';
      floret.root.rotation.y = azimuth;
      floret.root.rotation.x = 0.88;
      umbelRoot.add(floret.root);
      allFlorets.push(floret);
    }

    const topFloret = buildSpiderFloret(5);
    topFloret.root.rotation.x = 0.22;
    topFloret.root.rotation.z = -0.12;
    topFloret.root.scale.setScalar(0.96);
    umbelRoot.add(topFloret.root);
    allFlorets.push(topFloret);

    const crownAuraSprite = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: glowTex,
        color: 0x0ea5e9,
        transparent: true,
        opacity: 0.32,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    crownAuraSprite.position.set(0, 1.85, -0.4);
    crownAuraSprite.scale.set(6.8, 6.8, 1);
    scene.add(crownAuraSprite);

    // --- 6. FLOATING BIOLUMINESCENT SPORES ---
    const sporeCount = 130;
    const sporeGeo = new THREE.BufferGeometry();
    const sporePositions = new Float32Array(sporeCount * 3);
    const sporeColors = new Float32Array(sporeCount * 3);
    const sporeSpeeds = new Float32Array(sporeCount);
    const sporePhases = new Float32Array(sporeCount);

    const colCyan = new THREE.Color(0x38bdf8);
    const colIce = new THREE.Color(0xe0f2fe);
    const colCobalt = new THREE.Color(0x6366f1);

    for (let i = 0; i < sporeCount; i++) {
      const r = 0.6 + Math.random() * 4.4;
      const theta = Math.random() * Math.PI * 2;
      sporePositions[i * 3] = Math.cos(theta) * r;
      sporePositions[i * 3 + 1] = -2.2 + Math.random() * 6.4;
      sporePositions[i * 3 + 2] = Math.sin(theta) * r;

      sporeSpeeds[i] = 0.14 + Math.random() * 0.24;
      sporePhases[i] = Math.random() * Math.PI * 2;

      const pick = i % 3 === 0 ? colIce : (i % 3 === 1 ? colCyan : colCobalt);
      sporeColors[i * 3] = pick.r;
      sporeColors[i * 3 + 1] = pick.g;
      sporeColors[i * 3 + 2] = pick.b;
    }

    sporeGeo.setAttribute('position', new THREE.BufferAttribute(sporePositions, 3));
    sporeGeo.setAttribute('color', new THREE.BufferAttribute(sporeColors, 3));

    const sporeMat = new THREE.PointsMaterial({
      size: 0.14,
      map: glowTex,
      vertexColors: true,
      transparent: true,
      opacity: 0.88,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const spores = new THREE.Points(sporeGeo, sporeMat);
    scene.add(spores);

    // --- 7. ANIMATION LOOP ---
    let bloomProgress = 0;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      if (bloomProgress < 1) {
        bloomProgress = Math.min(1, bloomProgress + dt * 0.68);
      }
      const easeBloom = 1 - Math.pow(1 - bloomProgress, 3);

      sceneRoot.rotation.z = Math.sin(elapsed * 0.85) * 0.024;
      sceneRoot.rotation.x = Math.cos(elapsed * 0.70) * 0.018;

      allFlorets.forEach((floret) => {
        floret.tepals.forEach((t) => {
          const breathe = Math.sin(elapsed * 1.55 + t.phase) * 0.025;
          t.mesh.rotation.x = t.targetAngle * easeBloom + breathe;
        });
        floret.stamens.forEach((s) => {
          s.group.rotation.z = Math.sin(elapsed * 2.1 + s.phase) * 0.024;
        });
      });

      const pulse = 0.5 + 0.5 * Math.sin(elapsed * 1.9);
      tepalMat.emissiveIntensity = 1.05 + pulse * 0.42;
      filamentMat.emissiveIntensity = 1.35 + pulse * 0.50;
      antherMat.emissiveIntensity = 2.0 + pulse * 0.75;
      flowerCoreGlow.intensity = 3.2 + pulse * 1.2;
      crownAuraSprite.material.opacity = 0.26 + pulse * 0.11;
      groundAuraMat.opacity = 0.26 + pulse * 0.09;

      const posAttr = spores.geometry.attributes.position;
      for (let i = 0; i < sporeCount; i++) {
        let y = posAttr.getY(i) + dt * sporeSpeeds[i];
        let x = posAttr.getX(i) + Math.sin(elapsed * 1.2 + sporePhases[i]) * dt * 0.14;
        if (y > 4.2) {
          y = -2.2;
        }
        posAttr.setY(i, y);
        posAttr.setX(i, x);
      }
      posAttr.needsUpdate = true;
      spores.rotation.y = elapsed * 0.06;

      controls.update();
      composer.render();
    }

    window.addEventListener('resize', () => {
      updateCameraFraming();
      const dpr = Math.min(window.devicePixelRatio, 2);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(dpr);
      composer.setSize(window.innerWidth, window.innerHeight);
      composer.setPixelRatio(dpr);
      bloomPass.resolution.set(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
