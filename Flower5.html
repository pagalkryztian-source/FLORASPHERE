<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Delphinium Garden</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Soft overcast garden, like the reference photo: pale haze above, blurred green below. */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(250, 252, 255, 0.95) 0%, rgba(250, 252, 255, 0) 55%),
        linear-gradient(180deg, #cdd9d6 0%, #a4bb92 26%, #648848 52%, #345330 78%, #1f3520 100%);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Out-of-focus foliage and flowers behind the spikes. */
    body::before {
      content: "";
      position: fixed;
      inset: -5%;
      z-index: 0;
      pointer-events: none;
      filter: blur(16px);
      background:
        radial-gradient(circle at 12% 18%, rgba(205, 225, 140, 0.55) 0 6%, transparent 7%),
        radial-gradient(circle at 30% 8%, rgba(235, 240, 190, 0.5) 0 5%, transparent 6%),
        radial-gradient(circle at 52% 14%, rgba(190, 215, 130, 0.45) 0 7%, transparent 8%),
        radial-gradient(circle at 74% 6%, rgba(225, 235, 175, 0.5) 0 6%, transparent 7%),
        radial-gradient(circle at 90% 20%, rgba(170, 200, 110, 0.5) 0 6%, transparent 7%),
        radial-gradient(circle at 6% 44%, rgba(120, 165, 80, 0.55) 0 7%, transparent 8%),
        radial-gradient(circle at 94% 48%, rgba(120, 165, 80, 0.55) 0 8%, transparent 9%),
        radial-gradient(circle at 4% 86%, rgba(140, 110, 215, 0.6) 0 8%, transparent 9%),
        radial-gradient(circle at 15% 94%, rgba(110, 120, 225, 0.55) 0 7%, transparent 8%),
        radial-gradient(circle at 96% 90%, rgba(120, 100, 205, 0.5) 0 8%, transparent 9%),
        radial-gradient(circle at 85% 96%, rgba(95, 115, 220, 0.5) 0 6%, transparent 7%);
    }

    /* Gentle vignette. */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(10, 25, 12, 0.35) 100%);
    }

    canvas {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 38px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 40, 40, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 20px;
      font-weight: 300;
      text-decoration: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .nav-arrow:hover { background: rgba(20, 40, 40, 0.5); color: #fff; }
    .nav-arrow:active { transform: translateY(-50%) scale(0.94); }
    .nav-arrow.prev { left: 12px; }
    .nav-arrow.next { right: 12px; }

    .send-btn {
      position: fixed;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      padding: 7px 12px;
      font-size: 12px;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(20, 40, 40, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .send-btn:hover { background: rgba(20, 40, 40, 0.55); color: #fff; }
    .send-btn:active { transform: scale(0.96); }
    .send-btn.copied {
      color: #fbcfe8;
      border-color: rgba(251, 207, 232, 0.55);
      background: rgba(251, 207, 232, 0.18);
    }

    @media (max-width: 600px) {
      .nav-arrow { width: 32px; height: 46px; font-size: 18px; border-radius: 10px; }
      .nav-arrow.prev { left: 8px; }
      .nav-arrow.next { right: 8px; }
      .send-btn {
        right: 10px;
        bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        padding: 6px 11px;
        font-size: 11.5px;
      }
    }
  </style>
</head>
<body>
  <a href="Flower4.html" class="nav-arrow prev" aria-label="Previous flower file">&lt;</a>
  <a href="Flower6.html" class="nav-arrow next" aria-label="Next flower file">&gt;</a>
  <button type="button" class="send-btn" id="sendToSomeoneBtn" data-target-file="Flower5.html">Send to someone</button>

  <script>
    const sendBtn = document.getElementById('sendToSomeoneBtn');
    let sendTimer;

    sendBtn.addEventListener('click', async () => {
      const url = new URL(sendBtn.dataset.targetFile, window.location.href).href;
      try {
        await navigator.clipboard.writeText(url);
        sendBtn.textContent = 'Link copied';
        sendBtn.classList.add('copied');
      } catch (err) {
        console.error('Clipboard write failed:', err);
        sendBtn.textContent = 'Copy failed';
        sendBtn.classList.remove('copied');
      }
      clearTimeout(sendTimer);
      sendTimer = setTimeout(() => {
        sendBtn.textContent = 'Send to someone';
        sendBtn.classList.remove('copied');
      }, 2000);
    });
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    const { clamp, lerp } = THREE.MathUtils;
    const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
    const Y_AXIS = V3(0, 1, 0);
    const UP = V3(0, 1, 0);
    const TAU = Math.PI * 2;
    const GOLDEN = 2.39996;
    const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
    const col = (hex) => new THREE.Color(hex);

    // Seeded random: the garden is identical on every load.
    const rand = (() => {
      let s = 5150123;
      return () => {
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    })();

    // --- 1. RENDERER ---
    let pixelRatio = Math.min(window.devicePixelRatio, 1.5);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    const CAM_DIST = 12.5;
    camera.position.set(0, 3.8, CAM_DIST);

    const renderer = new THREE.WebGLRenderer({ antialias: window.devicePixelRatio < 2, alpha: true });
    renderer.setPixelRatio(pixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    // A faint haze pushes the back rows of spikes into the distance.
    scene.fog = new THREE.Fog(0xaec2a0, 13, 25);

    // Resize only touches aspect and fov, so the user's orbit and zoom are never reset.
    function frame() {
      const aspect = window.innerWidth / window.innerHeight;
      const halfTan = Math.max(Math.tan(THREE.MathUtils.degToRad(20)), 3.7 / (CAM_DIST * aspect));
      camera.aspect = aspect;
      camera.fov = 2 * THREE.MathUtils.radToDeg(Math.atan(halfTan));
      camera.updateProjectionMatrix();
    }
    frame();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.rotateSpeed = 0.6;
    controls.enablePan = false;
    controls.minDistance = 4;
    controls.maxDistance = 20;
    controls.minPolarAngle = 0.4;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.target.set(0, 3.0, 0);

    // --- 2. LIGHTING: soft overcast daylight, warm key, cool rim ---
    scene.add(new THREE.HemisphereLight(0xe6f0ff, 0x4a6a35, 1.05));
    const key = new THREE.DirectionalLight(0xfff4e6, 2.6);
    key.position.set(-4, 8, 6);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xcfe0ff, 1.3);
    rim.position.set(5, 4, -6);
    scene.add(rim);

    // --- 3. GEOMETRY HELPERS ---
    function buildGrid(nu, nv, fn) {
      const pos = [];
      const uv = [];
      const index = [];
      for (let j = 0; j <= nv; j++) {
        for (let i = 0; i <= nu; i++) {
          const p = fn(i / nu, j / nv);
          pos.push(p[0], p[1], p[2]);
          uv.push(i / nu, j / nv);
        }
      }
      for (let j = 0; j < nv; j++) {
        for (let i = 0; i < nu; i++) {
          const a = j * (nu + 1) + i;
          index.push(a, a + nu + 1, a + 1, a + 1, a + nu + 1, a + nu + 2);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      geo.setIndex(index);
      geo.computeVertexNormals();
      return geo;
    }

    function paintUV(geo, fn) {
      const uv = geo.attributes.uv;
      const colors = [];
      for (let i = 0; i < uv.count; i++) colors.push(...fn(uv.getX(i) * 2 - 1, uv.getY(i)));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      return geo;
    }

    function paintFn(geo, fn) {
      const p = geo.attributes.position;
      const colors = [];
      for (let i = 0; i < p.count; i++) { const c = fn(p.getX(i), p.getY(i), p.getZ(i)); colors.push(c.r, c.g, c.b); }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.deleteAttribute('uv');
      return geo;
    }

    const solid = (hex) => () => col(hex);
    const along = (geo, dir) => geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(Y_AXIS, dir.clone().normalize()));

    function basisQuat(dir, ref) {
      const y = dir.clone().normalize();
      const z = ref.clone().addScaledVector(y, -ref.dot(y)).normalize();
      const x = new THREE.Vector3().crossVectors(y, z);
      return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
    }

    function makeTube(curve, r0, r1, c0, c1, seg = 24, rad = 7) {
      const frames = curve.computeFrenetFrames(seg, false);
      const from = col(c0);
      const to = col(c1);
      const c = new THREE.Color();
      const pos = [];
      const nor = [];
      const colors = [];
      const index = [];
      for (let i = 0; i <= seg; i++) {
        const t = i / seg;
        const p = curve.getPointAt(t);
        const r = lerp(r0, r1, t);
        c.lerpColors(from, to, t);
        for (let j = 0; j <= rad; j++) {
          const q = (j / rad) * TAU;
          const n = frames.normals[i].clone().multiplyScalar(Math.cos(q)).addScaledVector(frames.binormals[i], Math.sin(q));
          pos.push(p.x + n.x * r, p.y + n.y * r, p.z + n.z * r);
          nor.push(n.x, n.y, n.z);
          colors.push(c.r, c.g, c.b);
        }
      }
      for (let i = 0; i < seg; i++) {
        for (let j = 0; j < rad; j++) {
          const k = i * (rad + 1) + j;
          const m = k + rad + 1;
          index.push(k, k + 1, m, k + 1, m + 1, m);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(index);
      return geo;
    }

    function canvasTex(w, h, draw) {
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      draw(canvas.getContext('2d'), w, h);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    // --- 4. DELPHINIUM FLORET ---
    // Five broad, overlapping blue sepals (the top one carries a backward spur) around a small
    // white-and-dark "bee" of true petals. Local frame: opens along +Y, upper sepal and spur toward +Z.
    // Palettes follow the reference photo, from pale sky blue through cornflower and royal to deep indigo.
    const PALETTES = {
      pale:       { base: '#f6fbff', mid: '#aed0f6', tip: '#86b4ec', glow: 0x3c6fb8, sheen: '#e8f3ff', bud: '#cfe6bf', bee: ['#ffffff', '#1c1a36'] },
      sky:        { base: '#eaf5ff', mid: '#6fb1f6', tip: '#3f8be6', glow: 0x1f5a9a, sheen: '#cfe6ff', bud: '#8fc2f0', bee: ['#ffffff', '#16162e'] },
      cornflower: { base: '#d8e6ff', mid: '#4d80f0', tip: '#2f5fe0', glow: 0x1a2f8f, sheen: '#b4ccff', bud: '#6890ec', bee: ['#fbfbff', '#12122c'] },
      royal:      { base: '#c6d6ff', mid: '#3459e0', tip: '#2040c2', glow: 0x142a8a, sheen: '#98b0ff', bud: '#4064d8', bee: ['#f4f4ff', '#0e0e28'] },
      indigo:     { base: '#9a9ae6', mid: '#2c2ca0', tip: '#17177c', glow: 0x0a0a52, sheen: '#7070e0', bud: '#3a329e', bee: ['#e6e2ff', '#08071c'] },
      midnight:   { base: '#a48ae6', mid: '#34268f', tip: '#1d1168', glow: 0x120a50, sheen: '#7f66d8', bud: '#4a329c', bee: ['#e2dcff', '#07061a'] }
    };

    const veinTex = canvasTex(64, 128, (c, W, H) => {
      c.fillStyle = '#fff';
      c.fillRect(0, 0, W, H);
      c.lineCap = 'round';
      for (let i = -6; i <= 6; i++) {
        c.strokeStyle = 'rgba(40, 60, 160, 0.17)';
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(W / 2 + i * 2.5, H);
        c.quadraticCurveTo(W / 2 + i * 4.5, H * 0.5, W / 2 + i * 5.5, 0);
        c.stroke();
      }
    });

    // Broad, rounded sepal outline with a slightly pointed tip.
    const sepalWidth = (v) => Math.max(0.4 * (1 - v) * (1 - v), Math.pow(Math.max(0, Math.sin(Math.PI * Math.pow(v, 0.78))), 0.62));

    function sepalGeometry(pal) {
      const N = 5;
      const L = 0.6;
      const base = col(pal.base);
      const mid = col(pal.mid);
      const tip = col(pal.tip);
      const c = new THREE.Color();

      // Sepals sweep outward and cup slightly forward, like an open star-bowl.
      const path = [{ r: 0.07, y: 0 }];
      for (let j = 1; j <= N; j++) {
        const a = 0.78 + 0.55 * ((j - 0.5) / N);
        const p = path[j - 1];
        path.push({ r: p.r + Math.sin(a) * (L / N), y: p.y + Math.cos(a) * (L / N) });
      }

      const parts = [];
      for (let k = 0; k < 5; k++) {
        const phi = Math.PI / 2 + (k * TAU) / 5;
        const wave = k * 1.9;
        const geo = buildGrid(4, N, (fu, fv) => {
          const u = fu * 2 - 1;
          const p = path[Math.round(fv * N)];
          const half = Math.min((0.36 * (k === 0 ? 1.1 : 1) * sepalWidth(fv)) / Math.max(p.r, 0.05), (Math.PI / 5) * 1.32);
          const th = phi + u * half;
          const ruffle = 0.014 * smooth(0.45, 1, fv) * Math.sin(u * 3 + wave) * Math.abs(u);
          const cup = 0.07 * u * u * Math.sin(Math.PI * Math.min(fv * 1.1, 1));
          // A hair of height per sepal stops the overlaps from z-fighting.
          const y = p.y + ruffle + cup + k * 0.005;
          return [p.r * Math.cos(th), y, p.r * Math.sin(th)];
        });
        parts.push(paintUV(geo, (u, v) => {
          c.lerpColors(base, mid, smooth(0.04, 0.5, v)).lerp(tip, smooth(0.5, 1, v));
          const shade = (1 - 0.15 * u * u) * (k === 0 ? 1.06 : 1 - 0.025 * (k % 3));
          return [c.r * shade, c.g * shade, c.b * shade];
        }));
      }

      // Hollow spur: a tapering horn curving backward from the upper sepal.
      const spur = makeTube(new THREE.CatmullRomCurve3([V3(0, 0, 0.1), V3(0, -0.2, 0.16), V3(0, -0.45, 0.2), V3(0, -0.75, 0.17)]),
        0.06, 0.012, pal.mid, pal.tip, 5, 5);
      spur.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(spur.attributes.position.count * 2), 2));
      parts.push(spur);
      return mergeGeometries(parts);
    }

    // The bee: two ruffled lower petals and two small upper ones, white fading to dark at the fringe, plus anthers.
    function beeGeometry(pal) {
      const parts = [];
      const white = col(pal.bee[0]);
      const dark = col(pal.bee[1]);
      const c = new THREE.Color();
      const blob = (cx, cy, cz, r, sx, sy, sz) => {
        const g = new THREE.SphereGeometry(r, 7, 5);
        g.scale(sx, sy, sz);
        g.translate(cx, cy, cz);
        return paintFn(g, (x, y, z) => c.clone().lerpColors(white, dark, smooth(0.5, 1.0, Math.hypot(x - cx, z - cz) / (r * Math.max(sx, sz)))));
      };
      parts.push(blob(-0.12, 0.1, -0.03, 0.16, 1, 0.42, 1.15));
      parts.push(blob(0.12, 0.1, -0.03, 0.16, 1, 0.42, 1.15));
      parts.push(blob(-0.06, 0.13, 0.08, 0.09, 1, 0.5, 1));
      parts.push(blob(0.06, 0.13, 0.08, 0.09, 1, 0.5, 1));
      for (const [ax, az] of [[-0.035, 0.02], [0.035, 0.02], [0, 0.06]]) {
        const a = new THREE.SphereGeometry(0.03, 5, 4);
        a.translate(ax, 0.17, az);
        parts.push(paintFn(a, solid('#241a40')));
      }
      return mergeGeometries(parts);
    }

    // Flower bud: fat green calyx shading to the palette colour, pointed tip.
    function budGeometry(pal) {
      const pts = [];
      for (let i = 0; i <= 6; i++) {
        const t = i / 6;
        pts.push(new THREE.Vector2(0.15 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.7)), 0.8), t * 0.36));
      }
      const green = col('#7aa85a');
      const tint = col(pal.bud);
      const c = new THREE.Color();
      return paintFn(new THREE.LatheGeometry(pts, 7), (x, y) => c.clone().lerpColors(green, tint, smooth(0.04, 0.3, y)));
    }

    // --- 5. LEAVES: palmate, deeply lobed, toothed ---
    const leafGeo = (() => {
      const parts = [];
      const dark = col('#24562c');
      const light = col('#68a548');
      const rib = col('#a6d283');
      const c = new THREE.Color();
      const LOBES = 7;
      for (let k = 0; k < LOBES; k++) {
        const ang = lerp(-1.75, 1.75, k / (LOBES - 1));
        const R = 0.7 + 0.42 * Math.cos(ang * 0.75);
        const dx = Math.sin(ang);
        const dy = Math.cos(ang);
        const geo = buildGrid(4, 12, (fu, fv) => {
          const u = fu * 2 - 1;
          const teeth = 1 + 0.14 * Math.sin(fv * 30 + k);
          const w = 0.24 * Math.pow(Math.max(0, Math.sin(Math.PI * Math.pow(fv, 0.65))), 0.85) * teeth;
          const d = fv * R;
          return [dx * d + dy * u * w, dy * d - dx * u * w, Math.abs(u) * w * 0.4 - 0.1 * fv * fv * R];
        });
        parts.push(paintUV(geo, (u, v) => {
          c.lerpColors(dark, light, smooth(0, 1, v));
          c.lerp(rib, clamp(1 - Math.abs(u) / 0.15, 0, 1) * 0.5);
          return [c.r, c.g, c.b];
        }));
      }
      return mergeGeometries(parts);
    })();

    const bladeGeo = paintUV(buildGrid(1, 5, (fu, fv) => [(fu * 2 - 1) * 0.045 * Math.pow(1 - fv, 0.9), fv, 0.3 * fv * fv]),
      (u, v) => [lerp(0.3, 0.9, v), lerp(0.4, 1, v), lerp(0.28, 0.8, v)]);

    // --- 6. MATERIALS ---
    const matOf = (extra) => new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, envMapIntensity: 0.5, ...extra });
    const stemMat = matOf({ roughness: 0.6 });
    const leafMat = matOf({ side: THREE.DoubleSide, roughness: 0.5 });
    const beeMat = matOf({ roughness: 0.7, side: THREE.DoubleSide });
    const budMat = matOf({ side: THREE.DoubleSide });

    // Velvety petals: a sheen layer in the palette colour softens the highlights.
    const sepalMats = {};
    const sepalMat = (name) => {
      const pal = PALETTES[name];
      if (!sepalMats[name]) {
        sepalMats[name] = new THREE.MeshPhysicalMaterial({
          vertexColors: true, map: veinTex, side: THREE.DoubleSide,
          roughness: 0.5, envMapIntensity: 0.5,
          emissive: pal.glow, emissiveIntensity: 0.16,
          sheen: 1, sheenRoughness: 0.45, sheenColor: col(pal.sheen)
        });
      }
      return sepalMats[name];
    };

    const grassUniforms = { uTime: { value: 0 } };
    const grassMat = matOf({ roughness: 0.7, side: THREE.DoubleSide, envMapIntensity: 0.3 });
    grassMat.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = grassUniforms.uTime;
      shader.vertexShader = 'uniform float uTime;\n' + shader.vertexShader.replace('#include <begin_vertex>', `
        #include <begin_vertex>
        float sw = position.y * position.y;
        vec3 ip = vec3(instanceMatrix[3][0], 0.0, instanceMatrix[3][2]);
        transformed.x += sin(uTime * 1.5 + ip.x * 0.7 + ip.z * 0.5) * 0.1 * sw;
        transformed.z += cos(uTime * 1.1 + ip.x * 0.5) * 0.05 * sw;
      `);
    };

    // --- 7. GROUND ---
    const groundY = (x, z) => 0.12 * Math.exp(-(x * x + z * z) / 14) + 0.03 * Math.sin(x * 1.3) * Math.cos(z * 1.1);

    const fadeTex = (() => {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 128;
      const c = canvas.getContext('2d');
      const g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0, '#fff');
      g.addColorStop(0.55, '#fff');
      g.addColorStop(0.95, '#000');
      c.fillStyle = g;
      c.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(canvas);
    })();

    const groundGeo = new THREE.PlaneGeometry(20, 20, 48, 48);
    groundGeo.rotateX(-Math.PI / 2);
    {
      const p = groundGeo.attributes.position;
      const colors = [];
      for (let i = 0; i < p.count; i++) {
        p.setY(i, groundY(p.getX(i), p.getZ(i)));
        const n = 0.5 + 0.5 * Math.sin(p.getX(i) * 2.1 + Math.cos(p.getZ(i) * 1.6) * 2);
        colors.push(lerp(0.12, 0.2, n), lerp(0.22, 0.34, n), lerp(0.08, 0.13, n));
      }
      groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      groundGeo.computeVertexNormals();
    }
    scene.add(new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 1, alphaMap: fadeTex, transparent: true, envMapIntensity: 0.2
    })));

    const GRASS = 900;
    const grass = new THREE.InstancedMesh(bladeGeo, grassMat, GRASS);
    grass.frustumCulled = false;
    {
      const m = new THREE.Matrix4();
      const q = new THREE.Quaternion();
      const greens = [0x4a8a34, 0x72a540, 0x94b446, 0x558f3e];
      for (let i = 0; i < GRASS; i++) {
        const a = rand() * TAU;
        const d = Math.sqrt(rand()) * 6;
        const x = Math.cos(a) * d * 1.25;
        const z = Math.sin(a) * d;
        const h = lerp(0.25, 0.85, rand()) * (1 - smooth(3, 6, d) * 0.8);
        const w = lerp(0.8, 1.3, rand());
        q.setFromAxisAngle(Y_AXIS, rand() * TAU);
        m.compose(V3(x, groundY(x, z), z), q, V3(w, h, w));
        grass.setMatrixAt(i, m);
        grass.setColorAt(i, col(greens[i % greens.length]));
      }
    }
    scene.add(grass);

    // --- 8. SPIKES ---
    // Each spike: curved stem + pedicels (one static mesh) and instanced florets / bees / buds on a golden spiral.
    // Florets are big and packed, open from the bottom upward, and taper into pale buds at the tip.
    const spikes = [];
    const easeOutBack = (x) => { const c1 = 1.70158; const x1 = x - 1; return 1 + (c1 + 1) * x1 * x1 * x1 + c1 * x1 * x1; };
    const tmpM = new THREE.Matrix4();

    function makeSpike({ x, z, h, lx = 0, lz = 0, pal: palName, delay, phase }) {
      const pal = PALETTES[palName];
      const group = new THREE.Group();
      group.position.set(x, groundY(x, z) - 0.02, z);
      scene.add(group);

      const points = [[0, 0, 0], [lx * 0.12, h * 0.3, lz * 0.1], [lx * 0.5, h * 0.64, lz * 0.5], [lx, h, lz]];
      const curve = new THREE.CatmullRomCurve3(points.map(([px, py, pz]) => V3(px, py, pz)));
      const parts = [makeTube(curve, 0.07, 0.022, '#3a6a35', '#86b15f', 60, 8)];

      const slots = Math.round(h * 13.5);
      const nBuds = Math.round(slots * 0.17);
      const openCount = slots - nBuds;

      const placed = [];
      const flowerStart = 0.27;
      for (let i = 0; i < slots; i++) {
        const t = i / (slots - 1);
        const s = flowerStart + t * (1 - flowerStart - 0.015);
        const center = curve.getPoint(s);
        const a = i * GOLDEN + phase;
        const el = 0.1 + 0.5 * t + 0.6 * smooth(0.85, 1, t);
        const dir = V3(Math.cos(a) * Math.cos(el), Math.sin(el), Math.sin(a) * Math.cos(el));
        const ped = lerp(0.2, 0.09, t);
        const pos = center.clone().addScaledVector(dir, ped);

        const ped3 = new THREE.CylinderGeometry(0.007, 0.011, 1, 4, 1);
        ped3.translate(0, 0.5, 0);
        ped3.scale(1, ped, 1);
        along(ped3, dir).translate(center.x, center.y, center.z);
        parts.push(paintFn(ped3, solid('#759f55')));

        const open = i < openCount;
        const k = open ? 0 : (i - openCount) / Math.max(1, nBuds - 1);
        placed.push({
          pos,
          qFloret: basisQuat(dir, UP),
          qBud: new THREE.Quaternion().setFromUnitVectors(Y_AXIS, dir),
          sFloret: lerp(0.46, 0.2, Math.pow(t / (openCount / slots), 0.85)),
          sBud: open ? lerp(0.7, 0.3, t) : lerp(0.95, 0.36, k),
          open,
          tOpen: delay + 0.6 + i * 0.035
        });
      }
      group.add(new THREE.Mesh(mergeGeometries(parts), stemMat));

      const openSlots = placed.filter((p) => p.open);
      const sepals = new THREE.InstancedMesh(sepalGeometry(pal), sepalMat(palName), openSlots.length);
      const bees = new THREE.InstancedMesh(beeGeometry(pal), beeMat, openSlots.length);
      const buds = new THREE.InstancedMesh(budGeometry(pal), budMat, slots);
      for (const m of [sepals, bees, buds]) { m.frustumCulled = false; group.add(m); }
      openSlots.forEach((p, i) => { p.floretIdx = i; });
      placed.forEach((p, i) => { p.budIdx = i; });

      spikes.push({ group, placed, sepals, bees, buds, phase, done: false, lastOpen: openSlots.length ? openSlots[openSlots.length - 1].tOpen + 1 : 0, H: h });
      return { x, z, h };
    }

    // Front row, middle row and a hazy back row, with light-to-dark blues mixed as in the photo.
    const SPIKES = [
      // front
      { x: -2.5,  z: 0.3,   h: 4.7, lx: -0.25, lz: 0.1,  pal: 'pale',       delay: 0.0 },
      { x: -1.25, z: 0.5,   h: 5.2, lx: -0.1,  lz: 0.1,  pal: 'sky',        delay: 0.5 },
      { x: 0.0,   z: 0.7,   h: 4.9, lx: 0.1,   lz: 0.05, pal: 'cornflower', delay: 1.0 },
      { x: 1.25,  z: 0.45,  h: 5.3, lx: 0.15,  lz: 0,    pal: 'indigo',     delay: 1.5 },
      { x: 2.5,   z: 0.2,   h: 4.6, lx: 0.3,   lz: 0.1,  pal: 'midnight',   delay: 2.0 },
      // middle
      { x: -1.9,  z: -0.7,  h: 5.7, lx: -0.2,  lz: 0,    pal: 'cornflower', delay: 0.8 },
      { x: -0.6,  z: -0.8,  h: 6.0, lx: 0.05,  lz: -0.1, pal: 'royal',      delay: 1.3 },
      { x: 0.65,  z: -0.75, h: 5.7, lx: 0.1,   lz: 0,    pal: 'sky',        delay: 1.8 },
      { x: 1.9,   z: -0.7,  h: 5.5, lx: 0.25,  lz: 0,    pal: 'midnight',   delay: 2.3 },
      // back
      { x: -3.2,  z: -1.8,  h: 6.0, lx: -0.3,  lz: 0,    pal: 'royal',      delay: 1.1 },
      { x: -1.3,  z: -2.3,  h: 6.3, lx: -0.05, lz: 0,    pal: 'pale',       delay: 1.6 },
      { x: 0.0,   z: -2.2,  h: 6.6, lx: 0,     lz: 0,    pal: 'indigo',     delay: 2.1 },
      { x: 1.5,   z: -2.3,  h: 6.2, lx: 0.1,   lz: 0,    pal: 'royal',      delay: 2.6 },
      { x: 3.1,   z: -1.8,  h: 6.0, lx: 0.3,   lz: 0,    pal: 'cornflower', delay: 3.0 }
    ];
    const spikeInfo = SPIKES.map((s, i) => makeSpike({ ...s, phase: i * 1.7 }));

    // Leaves: a lush rosette at the base, plus a few climbing each stem.
    const leafSpecs = [];
    const petioles = [];
    function addLeaf(start, angle, reach, rise, scale) {
      const end = start.clone().add(V3(Math.cos(angle) * reach, rise, Math.sin(angle) * reach));
      const mid = start.clone().lerp(end, 0.5).add(V3(0, rise * 0.45, 0));
      petioles.push(makeTube(new THREE.CatmullRomCurve3([start, mid, end]), 0.03, 0.02, '#3a6a35', '#5e9244', 10, 5));
      leafSpecs.push({ pos: end, quat: basisQuat(V3(Math.cos(angle) * 0.95, -0.2, Math.sin(angle) * 0.95), UP), scale });
    }
    for (let i = 0; i < 30; i++) {
      const a = (i / 30) * TAU + rand() * 0.4;
      const sx = (rand() - 0.5) * 6.2;
      const sz = -1.6 + rand() * 2.6;
      addLeaf(V3(sx, groundY(sx, sz), sz), a, 0.5 + rand() * 0.6, 0.4 + rand() * 0.6, 1.0 + rand() * 0.55);
    }
    for (const sp of spikeInfo) {
      addLeaf(V3(sp.x, 0.9 + rand() * 0.3, sp.z), rand() * TAU, 0.45, 0.1, 0.8 + rand() * 0.2);
      addLeaf(V3(sp.x, 1.6 + rand() * 0.4, sp.z), rand() * TAU, 0.4, 0.1, 0.65 + rand() * 0.2);
    }
    scene.add(new THREE.Mesh(mergeGeometries(petioles), stemMat));

    const leaves = new THREE.InstancedMesh(leafGeo, leafMat, leafSpecs.length);
    leaves.frustumCulled = false;
    leafSpecs.forEach((l, i) => {
      leaves.setMatrixAt(i, tmpM.compose(l.pos, l.quat, V3(l.scale, l.scale, l.scale)));
      leaves.setColorAt(i, col(['#ffffff', '#f0ffe8', '#f8ffe0', '#e0f5e0'][i % 4]));
    });
    scene.add(leaves);

    // --- 9. LIGHT HAZE + DRIFTING POLLEN ---
    const dotTex = canvasTex(64, 64, (c) => {
      const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, 'rgba(255, 255, 255, 1)');
      g.addColorStop(0.5, 'rgba(255, 255, 255, 0.55)');
      g.addColorStop(1, 'rgba(255, 255, 255, 0)');
      c.fillStyle = g;
      c.fillRect(0, 0, 64, 64);
    });
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color: 0xfff4d6, transparent: true, opacity: 0.22, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
    glow.position.set(0, 4.5, -4);
    glow.scale.setScalar(14);
    scene.add(glow);

    const MOTES = 45;
    const moteHome = new Float32Array(MOTES * 3);
    const motePhase = new Float32Array(MOTES);
    for (let i = 0; i < MOTES; i++) {
      const a = (i * 2.399) % TAU;
      const d = 1.2 + ((i * 0.618) % 1) * 4.5;
      moteHome[i * 3] = Math.cos(a) * d * 1.2;
      moteHome[i * 3 + 1] = ((i * 0.37) % 1) * 7;
      moteHome[i * 3 + 2] = Math.sin(a) * d * 0.6 + 1;
      motePhase[i] = i * 1.3;
    }
    const moteGeo = new THREE.BufferGeometry();
    moteGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(moteHome), 3));
    scene.add(new THREE.Points(moteGeo, new THREE.PointsMaterial({
      size: 0.09, map: dotTex, color: 0xfff3c8, transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending
    })));

    // --- 10. ANIMATION ---
    function updateBloom(sp, time) {
      for (const p of sp.placed) {
        let floret = 0;
        let bud = p.sBud;
        if (p.open) {
          const u = clamp((time - p.tOpen) / 0.9, 0, 1);
          floret = p.sFloret * easeOutBack(u);
          bud = p.sBud * (1 - smooth(0, 0.35, u));
        }
        sp.buds.setMatrixAt(p.budIdx, tmpM.compose(p.pos, p.qBud, V3(bud, bud, bud)));
        if (p.open) {
          const m = tmpM.compose(p.pos, p.qFloret, V3(floret, floret, floret));
          sp.sepals.setMatrixAt(p.floretIdx, m);
          sp.bees.setMatrixAt(p.floretIdx, m);
        }
      }
      for (const m of [sp.sepals, sp.bees, sp.buds]) m.instanceMatrix.needsUpdate = true;
    }

    const clock = new THREE.Clock();
    const leafQ = new THREE.Quaternion();
    const leafS = new THREE.Vector3();
    const bobQ = new THREE.Quaternion();
    const bobE = new THREE.Euler();
    let time = 0;
    let slowFrames = 0;

    function animate() {
      requestAnimationFrame(animate);
      const rawDt = clock.getDelta();
      time += Math.min(rawDt, 0.05);

      // Quality governor: if frames stay slow, step the pixel ratio down (never below 1).
      slowFrames = rawDt > 0.034 && rawDt < 0.25 ? slowFrames + 1 : Math.max(0, slowFrames - 1);
      if (slowFrames > 45 && pixelRatio > 1) {
        pixelRatio = Math.max(1, pixelRatio - 0.25);
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        slowFrames = 0;
      }

      grassUniforms.uTime.value = time;

      for (const sp of spikes) {
        if (!sp.done) {
          updateBloom(sp, time);
          if (time > sp.lastOpen) sp.done = true;
        }
        // Taller spikes sway a touch more, each on its own rhythm.
        sp.group.rotation.z = Math.sin(time * 0.7 + sp.phase) * 0.018;
        sp.group.rotation.x = Math.cos(time * 0.5 + sp.phase) * 0.012;
      }

      leafSpecs.forEach((l, i) => {
        bobQ.setFromEuler(bobE.set(Math.sin(time * 0.9 + i * 1.7) * 0.025, 0, Math.cos(time * 0.7 + i) * 0.02));
        leafQ.copy(l.quat).multiply(bobQ);
        leaves.setMatrixAt(i, tmpM.compose(l.pos, leafQ, leafS.setScalar(l.scale)));
      });
      leaves.instanceMatrix.needsUpdate = true;

      const mp = moteGeo.attributes.position;
      for (let i = 0; i < MOTES; i++) {
        const ph = motePhase[i];
        mp.setXYZ(i,
          moteHome[i * 3] + Math.sin(time * 0.5 + ph) * 0.5,
          0.3 + ((moteHome[i * 3 + 1] + time * (0.12 + (ph % 1) * 0.1)) % 7),
          moteHome[i * 3 + 2] + Math.cos(time * 0.45 + ph) * 0.5);
      }
      mp.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      frame();
    });

    animate();
  </script>
</body>
</html>
