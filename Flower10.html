<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Floating Tulip</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #3a0b2a 0%, #16040f 58%, #050107 100%);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Minimalist Left / Right File Switchers */
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 38px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(244, 114, 182, 0.06);
      border: 1px solid rgba(244, 114, 182, 0.22);
      border-radius: 12px;
      color: rgba(255, 228, 240, 0.85);
      font-size: 20px;
      font-weight: 300;
      text-decoration: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .nav-arrow:hover {
      background: rgba(244, 114, 182, 0.18);
      border-color: rgba(251, 168, 212, 0.5);
      color: #ffffff;
    }

    .nav-arrow.prev:active,
    .nav-arrow.next:active {
      transform: translateY(-50%) scale(0.94);
    }

    .nav-arrow.prev {
      left: 12px;
    }

    .nav-arrow.next {
      right: 12px;
    }

    /* Minimalist Bottom-Right "Send to someone" Button */
    .send-btn {
      position: fixed;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: rgba(255, 228, 240, 0.9);
      background: rgba(244, 114, 182, 0.08);
      border: 1px solid rgba(244, 114, 182, 0.24);
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .send-btn:hover {
      background: rgba(244, 114, 182, 0.2);
      color: #ffffff;
    }

    .send-btn:active {
      transform: scale(0.96);
    }

    .send-btn.copied {
      color: #fbcfe8;
      border-color: rgba(251, 168, 212, 0.6);
      background: rgba(219, 39, 119, 0.22);
    }

    @media (max-width: 600px) {
      .nav-arrow {
        width: 32px;
        height: 46px;
        font-size: 18px;
        border-radius: 10px;
      }

      .nav-arrow.prev {
        left: 8px;
      }

      .nav-arrow.next {
        right: 8px;
      }

      .send-btn {
        right: 10px;
        bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        padding: 6px 11px;
        font-size: 11.5px;
      }
    }
  </style>
</head>
<body>
  <a href="Flower9.html" class="nav-arrow prev" aria-label="Previous flower file">&lt;</a>
  <a href="Flower1.html" class="nav-arrow next" aria-label="Next flower file">&gt;</a>
  <button type="button" class="send-btn" id="sendToSomeoneBtn" data-target-file="Flower10.html">
    Send to someone
  </button>

  <script>
    (function setupLinkCopy() {
      const btn = document.getElementById('sendToSomeoneBtn');
      if (!btn) return;

      let resetTimer = null;

      function getFlowerFileUrl() {
        const targetFile = btn.getAttribute('data-target-file') || 'Flower10.html';
        try {
          const currentUrl = new URL(window.location.href);
          const pathParts = currentUrl.pathname.split('/');
          if (pathParts[pathParts.length - 1] && pathParts[pathParts.length - 1].includes('.')) {
            pathParts[pathParts.length - 1] = targetFile;
          } else {
            if (!currentUrl.pathname.endsWith('/')) {
              pathParts.push('');
            }
            pathParts.push(targetFile);
          }
          currentUrl.pathname = pathParts.join('/').replace(/\/{2,}/g, '/');
          return currentUrl.toString();
        } catch (e) {
          return targetFile;
        }
      }

      async function copyTextToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (err) {
            // Fall through to execCommand fallback
          }
        }

        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.setAttribute('readonly', '');
        textArea.style.position = 'fixed';
        textArea.style.top = '0';
        textArea.style.left = '-9999px';
        textArea.style.opacity = '0';
        document.body.appendChild(textArea);

        const selection = document.getSelection();
        const selectedRange = selection && selection.rangeCount > 0 ? selection.getRangeAt(0) : null;

        textArea.focus();
        textArea.select();
        textArea.setSelectionRange(0, textArea.value.length);

        let copied = false;
        try {
          copied = document.execCommand('copy');
        } catch (err) {
          copied = false;
        }

        document.body.removeChild(textArea);
        if (selectedRange && selection) {
          selection.removeAllRanges();
          if (selectedRange) selection.addRange(selectedRange);
        }
        return copied;
      }

      btn.addEventListener('click', async (event) => {
        event.stopPropagation();
        const urlToCopy = getFlowerFileUrl();
        const success = await copyTextToClipboard(urlToCopy);

        btn.textContent = success ? 'Link copied' : urlToCopy;
        btn.classList.add('copied');

        if (resetTimer) clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
          btn.textContent = 'Send to someone';
          btn.classList.remove('copied');
        }, 2000);
      });
    })();
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // --- 1. SCENE, CAMERA, RENDERER & BLOOM COMPOSER ---
    const scene = new THREE.Scene();

    // Deep plum / burgundy backdrop that matches the tulip's rose-crimson color
    function createBackdropTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(256, 215, 0, 256, 215, 360);
      grad.addColorStop(0.00, '#4d1038');
      grad.addColorStop(0.30, '#2a0a21');
      grad.addColorStop(0.65, '#12040d');
      grad.addColorStop(1.00, '#040106');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    scene.background = createBackdropTexture();
    scene.fog = new THREE.FogExp2(0x14040f, 0.022);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.55;

    function updateCameraFraming() {
      const aspect = window.innerWidth / window.innerHeight;
      camera.aspect = aspect;
      if (aspect < 0.75) {
        camera.position.set(0, 0.9, 11.8);
      } else if (aspect < 1.1) {
        camera.position.set(0, 0.7, 9.6);
      } else {
        camera.position.set(0, 0.6, 8.4);
      }
      camera.updateProjectionMatrix();
    }
    updateCameraFraming();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.75;
    controls.zoomSpeed = 0.85;
    controls.panSpeed = 0.75;
    controls.minDistance = 3.2;
    controls.maxDistance = 17;
    controls.maxPolarAngle = Math.PI * 0.88;
    controls.target.set(0, -0.1, 0);
    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN
    };

    // --- 2. SOFT, NATURAL LIGHTING (no glow) ---
    const hemiLight = new THREE.HemisphereLight(0xffe9f1, 0x3a0f2a, 0.9);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xfff1f5, 2.4);
    keyLight.position.set(4.5, 8, 6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xe9b6d0, 0.7);
    fillLight.position.set(-6, 2, 4);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xff9ec4, 0.9);
    rimLight.position.set(-4, 5, -7);
    scene.add(rimLight);

    // --- 3. PROCEDURAL LUMINOUS TULIP TEXTURES ---
    function createTulipPetalAlbedo() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // base (bottom) -> tip (top): pale green-white heel, then rich rose-crimson
      const grad = ctx.createLinearGradient(0, 512, 0, 0);
      grad.addColorStop(0.00, '#e7efd6');
      grad.addColorStop(0.07, '#f3d3d9');
      grad.addColorStop(0.20, '#e0527f');
      grad.addColorStop(0.55, '#c21d5b');
      grad.addColorStop(0.88, '#a3124a');
      grad.addColorStop(1.00, '#8a0d3f');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 512);

      // lighter feathered edge, like a real tulip petal
      const edgeGrad = ctx.createLinearGradient(0, 0, 256, 0);
      edgeGrad.addColorStop(0.00, 'rgba(255, 190, 210, 0.55)');
      edgeGrad.addColorStop(0.16, 'rgba(255, 190, 210, 0.12)');
      edgeGrad.addColorStop(0.30, 'rgba(255, 190, 210, 0.0)');
      edgeGrad.addColorStop(0.70, 'rgba(255, 190, 210, 0.0)');
      edgeGrad.addColorStop(0.84, 'rgba(255, 190, 210, 0.12)');
      edgeGrad.addColorStop(1.00, 'rgba(255, 190, 210, 0.55)');
      ctx.fillStyle = edgeGrad;
      ctx.fillRect(0, 0, 256, 512);

      // darker flame streaks running up the petal
      ctx.lineCap = 'round';
      for (let i = -14; i <= 14; i++) {
        const dark = (i % 3 === 0);
        ctx.strokeStyle = dark ? 'rgba(110, 8, 45, 0.20)' : 'rgba(255, 150, 185, 0.10)';
        ctx.lineWidth = dark ? 3.0 : 1.2;
        ctx.beginPath();
        ctx.moveTo(128 + i * 2.5, 512);
        ctx.bezierCurveTo(
          128 + i * 7.5, 340,
          128 + i * 7.5, 170,
          128 + i * 1.8, 6
        );
        ctx.stroke();
      }

      // gentle central midrib
      ctx.strokeStyle = 'rgba(255, 170, 200, 0.22)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(128, 512);
      ctx.lineTo(128, 10);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function createLeafTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 512, 0, 0);
      grad.addColorStop(0.00, '#7bc6a0');
      grad.addColorStop(0.25, '#2f8a63');
      grad.addColorStop(0.70, '#1b5e47');
      grad.addColorStop(1.00, '#0f3b33');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 512);

      ctx.lineCap = 'round';
      for (let i = -9; i <= 9; i++) {
        ctx.strokeStyle = i === 0 ? 'rgba(200, 255, 225, 0.6)' : 'rgba(170, 240, 200, 0.16)';
        ctx.lineWidth = i === 0 ? 2.4 : 0.9;
        ctx.beginPath();
        ctx.moveTo(64 + i * 1.6, 512);
        ctx.quadraticCurveTo(64 + i * 4.2, 260, 64 + i * 1.0, 6);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    // --- 4. CUSTOM SCULPTED 3D TULIP GEOMETRIES ---
    // A tulip tepal is built from a "spine" path: it starts at the base leaning OUTWARD by
    // angle a0, then bends continuously INWARD (to -a1) so the six tepals close into an
    // egg-shaped cup. The blade is ovate (widest low), pointed at the tip, cupped across
    // its width, with a soft midrib ridge.
    function createTulipTepalGeometry(length, width, a0, a1, curl, ridge, flare) {
      const segU = 20;
      const segV = 52;
      const geometry = new THREE.PlaneGeometry(1, 1, segU, segV);

      // Pre-integrate the spine path in the (outward z, up y) plane
      const N = 240;
      const Zt = new Float32Array(N + 1);
      const Yt = new Float32Array(N + 1);
      const Pt = new Float32Array(N + 1);
      let zAcc = 0;
      let yAcc = 0;
      for (let k = 0; k <= N; k++) {
        const v = k / N;
        const s = Math.min(1, Math.max(0, (v - 0.82) / 0.18));
        const smooth = s * s * (3 - 2 * s);
        const phi = a0 - (a0 + a1) * Math.pow(v, 1.15) + flare * smooth;
        Pt[k] = phi;
        Zt[k] = zAcc;
        Yt[k] = yAcc;
        zAcc += (length * Math.sin(phi)) / N;
        yAcc += (length * Math.cos(phi)) / N;
      }

      const pos = geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const u = pos.getX(i) * 2;       // -1 .. 1 across the blade
        const v = pos.getY(i) + 0.5;     //  0 .. 1 base to tip

        const f = v * N;
        const k0 = Math.min(N, Math.floor(f));
        const k1 = Math.min(N, k0 + 1);
        const t = f - k0;
        const Zp = Zt[k0] * (1 - t) + Zt[k1] * t;
        const Yp = Yt[k0] * (1 - t) + Yt[k1] * t;
        const phi = Pt[k0] * (1 - t) + Pt[k1] * t;

        // ovate outline with a pointed tip
        const s = Math.sin(Math.PI * Math.pow(v, 0.7));
        const widthProfile = Math.max(Math.pow(Math.max(s, 0), 0.6), 0.16 * (1 - v));
        const x = u * (width / 2) * widthProfile;

        // cross-section: edges curl inward, midrib ridge pushes outward, faint edge wave
        const baseFade = Math.min(1, v * 3.0);
        const offset =
          -curl * u * u * baseFade +
          ridge * (1 - Math.abs(u)) * Math.sin(Math.PI * v) +
          0.011 * Math.sin(v * Math.PI * 6.0) * u * u * baseFade;

        // outward normal of the spine in the (z, y) plane
        const nz = Math.cos(phi);
        const ny = -Math.sin(phi);

        pos.setXYZ(i, x, Yp + ny * offset, Zp + nz * offset);
      }

      geometry.computeVertexNormals();
      return geometry;
    }

    // A tulip leaf: broad clasping base that wraps the stem, widest low, tapering to a point,
    // then arching gently away from the stem. Built around the stem's own axis.
    function createLeafGeometry(curve, maxHalfWidth, twist, sideVec, radialVec, axisAt) {
      const segU = 10;
      const segV = 56;
      const WRAP_R = 0.064;     // just outside the stem radius
      const WRAP_LEN = 0.22;    // fraction of the leaf (from base) that hugs the stem
      const positions = [];
      const uvs = [];
      const indices = [];
      const quat = new THREE.Quaternion();

      for (let j = 0; j <= segV; j++) {
        const t = j / segV;
        const p = curve.getPointAt(t);
        const T = curve.getTangentAt(t).normalize();
        quat.setFromAxisAngle(T, twist * Math.pow(t, 1.4));
        const s2 = sideVec.clone().applyQuaternion(quat);
        const n = new THREE.Vector3().crossVectors(T, s2).normalize();

        const w = maxHalfWidth * (
          Math.pow(Math.max(Math.sin(Math.PI * Math.pow(t, 0.55)), 0), 0.75) * 0.95 +
          0.45 * Math.pow(1 - t, 6)
        );

        const k = Math.pow(Math.max(0, 1 - t / WRAP_LEN), 1.5);   // 1 at the base -> 0
        const axis = axisAt(p.y);

        for (let i = 0; i <= segU; i++) {
          const u = (i / segU) * 2 - 1;
          const fold = -Math.abs(u) * w * 0.5;
          const free = p.clone()
            .addScaledVector(s2, u * w)
            .addScaledVector(n, fold);

          let q = free;
          if (k > 0.001) {
            const theta = Math.max(-2.3, Math.min(2.3, (u * w) / WRAP_R));
            const wrapped = new THREE.Vector3(axis.x, p.y, axis.z)
              .addScaledVector(radialVec, WRAP_R * Math.cos(theta))
              .addScaledVector(sideVec, WRAP_R * Math.sin(theta));
            q = free.lerp(wrapped, k);
          }
          positions.push(q.x, q.y, q.z);
          uvs.push((u + 1) / 2, t);
        }
      }

      for (let j = 0; j < segV; j++) {
        for (let i = 0; i < segU; i++) {
          const a = j * (segU + 1) + i;
          const b = a + 1;
          const c = a + (segU + 1);
          const d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function createAntherGeometry() {
      const geo = new THREE.SphereGeometry(0.026, 10, 10);
      geo.scale(0.8, 2.6, 0.8);
      return geo;
    }

    // --- 5. BUILD THE FLOATING BIOLUMINESCENT ROSE TULIP ---
    const sceneRoot = new THREE.Group();
    scene.add(sceneRoot);

    // Single elegant stem
    const stemCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.00, -2.35, 0.00),
      new THREE.Vector3(-0.10, -1.40, 0.05),
      new THREE.Vector3(0.06, -0.40, -0.04),
      new THREE.Vector3(0.15, 0.45, 0.02),
      new THREE.Vector3(0.10, 0.98, 0.00)
    ]);

    const stemGeo = new THREE.TubeGeometry(stemCurve, 70, 0.05, 14, false);
    const stemMat = new THREE.MeshStandardMaterial({
      color: 0x5f9a58,
      roughness: 0.55,
      metalness: 0.0
    });
    const stemMesh = new THREE.Mesh(stemGeo, stemMat);
    sceneRoot.add(stemMesh);

    // soft cut end at the bottom of the floating stem
    const stemBase = stemCurve.getPoint(0);
    const stemBaseDir = stemCurve.getTangent(0).negate();
    const stemCap = new THREE.Mesh(new THREE.CircleGeometry(0.05, 14), stemMat);
    stemCap.position.copy(stemBase);
    stemCap.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), stemBaseDir);
    sceneRoot.add(stemCap);

    // Leaves clasping the stem
    const leafTex = createLeafTexture();
    const leafMat = new THREE.MeshStandardMaterial({
      map: leafTex,
      color: 0xffffff,
      roughness: 0.5,
      metalness: 0.0,
      side: THREE.DoubleSide
    });

    const leaves = [];
    const stemLength = stemCurve.getLength();

    // pts are [radial distance from the stem axis, height above the leaf's start]
    function addLeaf(startT, azimuth, pts, halfWidth, twist) {
      const startPt = stemCurve.getPointAt(startT);
      const radial = new THREE.Vector3(Math.cos(azimuth), 0, -Math.sin(azimuth));
      const side = new THREE.Vector3(-radial.z, 0, radial.x);

      // where the stem axis sits (relative to the leaf's start) at a given height
      const axisAt = (h) => {
        const tt = Math.min(1, Math.max(0, startT + h / stemLength));
        const sp = stemCurve.getPointAt(tt);
        return { x: sp.x - startPt.x, z: sp.z - startPt.z };
      };

      const curvePts = pts.map(([r, h]) => {
        const a = axisAt(h);
        return new THREE.Vector3(a.x + radial.x * r, h, a.z + radial.z * r);
      });
      const curve = new THREE.CatmullRomCurve3(curvePts);

      const mesh = new THREE.Mesh(
        createLeafGeometry(curve, halfWidth, twist, side, radial, axisAt),
        leafMat
      );
      const holder = new THREE.Group();
      holder.position.copy(startPt);
      holder.add(mesh);
      sceneRoot.add(holder);
      leaves.push({ holder, phase: azimuth * 2.3 });
    }

    // Long leaf: rises hugging the stem, then arches outward and droops at the tip
    addLeaf(0.02, 0.65,
      [[0.064, 0.0], [0.07, 0.55], [0.14, 1.15], [0.32, 1.70], [0.62, 2.05], [0.94, 2.00], [1.14, 1.76]],
      0.17, 0.25);
    // Shorter leaf on the opposite side
    addLeaf(0.04, 0.65 + Math.PI * 0.95,
      [[0.064, 0.0], [0.07, 0.50], [0.12, 1.00], [0.26, 1.42], [0.50, 1.68], [0.76, 1.64], [0.94, 1.44]],
      0.14, -0.22);

    // Head of the tulip sits on the stem tip and follows its final tangent
    const stemTip = stemCurve.getPoint(1);
    const headRoot = new THREE.Group();
    headRoot.position.copy(stemTip);
    headRoot.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      stemCurve.getTangent(1).normalize()
    );
    sceneRoot.add(headRoot);

    const petalAlbedo = createTulipPetalAlbedo();

    const tepalMat = new THREE.MeshPhysicalMaterial({
      map: petalAlbedo,
      roughness: 0.48,
      metalness: 0.0,
      sheen: 0.6,
      sheenRoughness: 0.5,
      sheenColor: new THREE.Color(0xffc2d4),
      clearcoat: 0.12,
      clearcoatRoughness: 0.5,
      side: THREE.DoubleSide
    });

    const innerTepalMat = tepalMat.clone();
    innerTepalMat.color = new THREE.Color(0xf2c8d6);

    const calyxMat = new THREE.MeshStandardMaterial({
      color: 0x8fb36f,
      roughness: 0.6
    });

    const filamentMat = new THREE.MeshStandardMaterial({
      color: 0xe8e2b8,
      roughness: 0.55
    });

    const antherMat = new THREE.MeshStandardMaterial({
      color: 0x2a1030,
      roughness: 0.4
    });

    // Outer whorl: 3 tepals, longer, more flared. Inner whorl: 3 tepals, offset by 60 degrees, tucked inside.
    const outerGeo = createTulipTepalGeometry(1.32, 0.90, 1.08, 1.08, 0.13, 0.045, 0.32);
    const innerGeo = createTulipTepalGeometry(1.20, 0.84, 0.96, 0.98, 0.10, 0.035, 0.12);
    const antherGeo = createAntherGeometry();

    const tulipTepals = [];
    const tulipStamens = [];

    // receptacle / calyx hugging the petal bases
    const receptacle = new THREE.Mesh(new THREE.SphereGeometry(0.085, 16, 14), calyxMat);
    receptacle.scale.set(1.0, 1.25, 1.0);
    receptacle.position.y = 0.0;
    headRoot.add(receptacle);

    const flowerHead = new THREE.Group();
    flowerHead.position.y = 0.02;
    headRoot.add(flowerHead);

    for (let t = 0; t < 6; t++) {
      const isInner = t % 2 === 1;
      const angle = (t / 6) * Math.PI * 2;
      const pivot = new THREE.Group();
      pivot.rotation.y = angle;
      pivot.position.y = isInner ? 0.012 : 0;

      const tepalMesh = new THREE.Mesh(isInner ? innerGeo : outerGeo, isInner ? innerTepalMat : tepalMat);
      const targetOpen = isInner ? 0.0 : 0.04;
      tepalMesh.rotation.x = -0.22;

      pivot.add(tepalMesh);
      flowerHead.add(pivot);
      tulipTepals.push({
        mesh: tepalMesh,
        closedAngle: isInner ? -0.2 : -0.24,
        targetAngle: targetOpen,
        phase: t * 0.55
      });
    }

    // Six glowing stamens + central pistil nestled inside the cup
    for (let s = 0; s < 6; s++) {
      const angle = (s / 6) * Math.PI * 2 + 0.26;
      const stamenPivot = new THREE.Group();
      stamenPivot.rotation.y = angle;

      const spread = 0.09 + (s % 2) * 0.03;
      const topH = 0.80 + (s % 3) * 0.05;
      const stCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0.015, 0.04, 0),
        new THREE.Vector3(spread * 0.9, 0.30, 0),
        new THREE.Vector3(spread * 1.2, 0.58, 0),
        new THREE.Vector3(spread, topH, 0)
      ]);

      const filGeo = new THREE.TubeGeometry(stCurve, 20, 0.0075, 6, false);
      const filMesh = new THREE.Mesh(filGeo, filamentMat);

      const antherMesh = new THREE.Mesh(antherGeo, antherMat);
      const tipPt = stCurve.getPoint(1);
      antherMesh.position.copy(tipPt);
      antherMesh.rotation.z = -0.12;

      stamenPivot.add(filMesh, antherMesh);
      flowerHead.add(stamenPivot);
      tulipStamens.push({ group: stamenPivot, phase: s * 0.7 });
    }

    const pistilMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02, 0.032, 0.78, 10),
      filamentMat
    );
    pistilMesh.position.y = 0.4;
    flowerHead.add(pistilMesh);

    for (let k = 0; k < 3; k++) {
      const a = (k / 3) * Math.PI * 2;
      const lobe = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 10), antherMat);
      lobe.scale.set(1.0, 0.8, 1.0);
      lobe.position.set(Math.cos(a) * 0.03, 0.8, Math.sin(a) * 0.03);
      flowerHead.add(lobe);
    }

    // --- 6. ANIMATION LOOP ---
    let bloomProgress = 0;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      if (bloomProgress < 1) {
        bloomProgress = Math.min(1, bloomProgress + dt * 0.55);
      }
      const easeBloom = 1 - Math.pow(1 - bloomProgress, 3);

      // Floating: gentle bob, sway and a slow drifting turn
      sceneRoot.position.y = Math.sin(elapsed * 0.9) * 0.09;
      sceneRoot.rotation.z = Math.sin(elapsed * 0.85) * 0.03;
      sceneRoot.rotation.x = Math.cos(elapsed * 0.70) * 0.02;
      sceneRoot.rotation.y = elapsed * 0.1;

      // head nods softly on the stem tip
      flowerHead.rotation.z = Math.sin(elapsed * 1.1) * 0.02;
      flowerHead.rotation.x = Math.cos(elapsed * 0.9) * 0.015;

      tulipTepals.forEach((t) => {
        const breathe = Math.sin(elapsed * 1.55 + t.phase) * 0.018;
        t.mesh.rotation.x = t.closedAngle + (t.targetAngle - t.closedAngle) * easeBloom + breathe;
      });
      tulipStamens.forEach((s) => {
        s.group.rotation.z = Math.sin(elapsed * 2.1 + s.phase) * 0.02;
      });

      leaves.forEach((l) => {
        l.holder.rotation.z = Math.sin(elapsed * 0.9 + l.phase) * 0.025;
      });

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      updateCameraFraming();
      const dpr = Math.min(window.devicePixelRatio, 2);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(dpr);
    });

    animate();
  </script>
</body>
</html>
